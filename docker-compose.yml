version: '3.8'

services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
    depends_on:
      - chromadb
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-chatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - rag-network
    restart: unless-stopped

  # ── ChromaDB (Vector Store) ────────────────────────────────
  # ── Neo4j (Knowledge Graph) ───────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: rag-chatbot-neo4j
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/changeme-password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme-password", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── ChromaDB (Vector Store) ────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chatbot-chromadb
    ports:
      - "8200:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    networks:
      - rag-network
    restart: unless-stopped

volumes:
  backend-data:
  chroma-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:

networks:
  rag-network:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# NOTE: RAGFlow requires its own Docker Compose stack.
# Run separately:
#   git clone https://github.com/infiniflow/ragflow.git
#   cd ragflow/docker
#   docker compose up -d
# Then configure RAGFLOW_BASE_URL in backend/.env
# ─────────────────────────────────────────────────────────────
