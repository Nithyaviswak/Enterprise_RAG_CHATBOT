name: rag-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rag-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + hermetic evaluation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-runtime.txt -r requirements-dev.txt

      - name: Unit & integration tests
        run: python -m pytest -q

      - name: Hermetic evaluation (offline harness + gates)
        run: python evaluation/evaluate.py --offline

      - name: Core package import smoke
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import app.config, app.observability.tracing, app.rag.pipeline, evaluation.metrics; print('imports OK')"

  evaluate-live:
    name: Live RAGAS-style evaluation (requires Gemini key)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && secrets.GEMINI_API_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-runtime.txt -r requirements-dev.txt
      - name: Copy API key to backend .env
        shell: bash
        run: |
          mkdir -p backend
          printf 'GEMINI_API_KEY=%s\n' "${{ secrets.GEMINI_API_KEY }}" > backend/.env
      - name: Run live evaluation over the knowledge base
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python evaluation/evaluate.py --sample-delay 12
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: evaluation/reports/
          if-no-files-found: warn